<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#24442f">
  <title>Updating App - A. Farrell Contracting</title>
  <link rel="icon" type="image/png" href="{{ url_for('app_icon_png', size=180) }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='af_brand.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='combined.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='maintenance.css') }}">
</head>
<body>
  <div class="shell">
    <header class="topbar"><div class="brand-block"><p class="eyebrow">A. Farrell Contracting</p><h1>Updating App</h1></div></header>
    <main class="maintenance-layout">
      <section class="panel maintenance-panel" aria-labelledby="update-heading">
        <div class="section-heading"><div><h2 id="update-heading">Update installed</h2><p id="update-status" role="status" aria-live="polite">The app is restarting. This page will open the app again as soon as it is ready — it can take up to a minute.</p></div></div>
        <div class="maintenance-actions">
          <a class="primary" id="return-link" href="{{ home_url }}" style="display:none">Return To App</a>
        </div>
      </section>
    </main>
  </div>
  <script>
    (function () {
      const startedBoot = {{ boot_id|tojson }};
      const target = {{ home_url|tojson }};
      const status = document.getElementById('update-status');
      const link = document.getElementById('return-link');
      const startedAt = Date.now();
      async function check() {
        try {
          const response = await fetch('/health?_=' + Date.now(), { cache: 'no-store' });
          if (response.ok) {
            const data = await response.json();
            // The old process keeps answering until it restarts, so wait for a new one.
            if (data.boot && data.boot !== startedBoot) {
              window.location.replace(target);
              return;
            }
          }
        } catch (error) {}
        if (Date.now() - startedAt > 180000) {
          status.textContent = 'The app has not come back yet. Wait a moment, then press Return To App. If it still does not open, restart the Pi.';
          link.style.display = '';
          return;
        }
        window.setTimeout(check, 1500);
      }
      window.setTimeout(check, 3000);
    })();
  </script>
</body>
</html>
